<!doctype html>
<!-- SPDX-License-Identifier: MIT -->
<html lang="en">
<head>
<!-- @include head -->
<meta name="robots" content="noindex">
</head>
<body>
<!-- @include header -->
<main id="main" class="auth">
  <div class="auth-card">

    <section id="login" data-view="login">
      <h1>Log in to {{ product }}</h1>
      <p class="auth-sub">Your team's calls, decisions and tasks.</p>
      <a class="btn btn-google btn-block" href="/api/auth/google" data-google>
        <svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
        Continue with Google
      </a>
      <p class="auth-or"><span>or</span></p>
      <form class="auth-form" action="/api/auth/login" method="post" data-login>
        <label for="login-email">Work email</label>
        <input id="login-email" name="email" type="email" required autocomplete="email" placeholder="you@company.com">
        <div class="label-row">
          <label for="login-password">Password</label>
          <a href="#forgot" data-goto="forgot">Forgot password?</a>
        </div>
        <div class="password-field">
          <input id="login-password" name="password" type="password" required autocomplete="current-password">
          <button type="button" class="reveal" data-reveal aria-controls="login-password" aria-pressed="false">Show</button>
        </div>
        <button class="btn btn-block" type="submit">Log in</button>
      </form>
      <div class="auth-msg" role="status" aria-live="polite" data-status hidden></div>
      <p class="auth-foot">New to {{ product }}? <a href="/book">Book a demo</a></p>
    </section>

    <section id="forgot" data-view="forgot" hidden>
      <h2 class="auth-title">Reset your password</h2>
      <p class="auth-sub">Enter your work email and we'll send you a link to set a new password.</p>
      <form class="auth-form" action="/api/auth/forgot" method="post" data-forgot>
        <label for="forgot-email">Work email</label>
        <input id="forgot-email" name="email" type="email" required autocomplete="email" placeholder="you@company.com">
        <button class="btn btn-block" type="submit">Send reset link</button>
      </form>
      <div class="auth-msg" role="status" aria-live="polite" data-status hidden></div>
      <p class="auth-foot"><a href="#login" data-goto="login">Back to log in</a></p>
    </section>

  </div>
</main>
<!-- @include footer -->
<script src="/assets/login.js" defer></script>
</body>
</html>
